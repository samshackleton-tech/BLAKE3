[package]
name = "blake3-servil"
version = "0.8.0+dev"
authors = ["John Servil", "Devon Jonte", "Sam Shackleton"]
description = "the BLAKE3 hash function on every core: blake3-servil-core's kernels behind a shared thread pool and a pipeline"
repository = "https://github.com/servil-software-factory/BLAKE3"
license = "CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception"
edition = "2024"
include = ["/src", "/build.rs", "/blake3_gpu.*", "/LICENSE_*"]

[dependencies]
# The one-thread library: the kernels and their proofs, the Hasher, the
# direct and grouped calls. This crate re-exports it whole.
blake3-servil-core = { version = "=0.8.0+dev", path = ".." }
arrayvec = { version = "0.7.4", default-features = false }

[build-dependencies]
cc = "1.1.12"
